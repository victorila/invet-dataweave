name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-dataweave:
    runs-on: windows-latest

    steps:
    - name: Checkout cod
      uses: actions/checkout@v4

    - name: Configurare Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Descarcare si Configurare DW CLI
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/mulesoft-labs/data-weave-cli/releases/download/v1.0.36/dw-1.0.36-Windows.zip" -OutFile "dw.zip"
        Expand-Archive -Path "dw.zip" -DestinationPath "$env:USERPROFILE\dw"
        "$env:USERPROFILE\dw\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Executare si Validare Transformare DataWeave
      shell: powershell
      run: |
        dw run -i payload=input.json -f transformare.dwl

