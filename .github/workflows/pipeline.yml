name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codul tau din Git
        uses: actions/checkout@v4

      - name: Configurare Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clonare DataWeave CLI din Git
        run: |
          git clone https://github.com/mulesoft/data-weave-cli.git $HOME/dw-cli

      - name: Compilare si adaugare in PATH
        run: |
          cd $HOME/dw-cli
          chmod +x gradlew
          ./gradlew native-cli:installDist -x test
          
          DW_BIN_DIR=$(find $HOME/dw-cli/native-cli/build/install -type d -name "bin" | head -n 1)
          
          if [ -f "$DW_BIN_DIR/native-cli" ]; then
            ln -s "$DW_BIN_DIR/native-cli" "$DW_BIN_DIR/dw"
          fi
          if [ -f "$DW_BIN_DIR/data-weave-cli" ]; then
            ln -s "$DW_BIN_DIR/data-weave-cli" "$DW_BIN_DIR/dw"
          fi
          
          echo "$DW_BIN_DIR" >> $GITHUB_PATH

      - name: Verificare instalare DataWeave
        run: dw --version

      - name: Executare si Validare Transformare DataWeave
        run: |
          dw -i input.json -f transformare.dwl