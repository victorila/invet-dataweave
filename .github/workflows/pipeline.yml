name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod din Git
        uses: actions/checkout@v4

      - name: Configurare Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clonare depozit DataWeave CLI
        run: |
          git clone https://github.com/mulesoft/data-weave-cli.git $HOME/dw-cli

      - name: Compilare proiect cu Gradle
        run: |
          cd $HOME/dw-cli
          chmod +x gradlew
          ./gradlew native-cli:installDist -x test

      - name: Configurare PATH si comanda dw
        run: |
          # Gasim folderul exact de instalare creat de Gradle
          BIN_PATH=$(find $HOME/dw-cli/native-cli/build/install -type d -name "bin" | head -n 1)
          
          # Cream link simbolic pentru comanda dw in /usr/local/bin
          sudo ln -s $BIN_PATH/* /usr/local/bin/

      - name: Testare comanda dw
        run: dw --version

      - name: Executare si Validare Transformare DataWeave
        run: |
          dw -i payload input.json -f transformare.dwl