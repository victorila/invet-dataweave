name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout cod
      uses: actions/checkout@v4

    - name: Configurare Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalare DataWeave CLI via npm
      run: |
        npm install -g @mulesoft/data-weave-cli

    - name: Executare si Validare Transformare DataWeave
      run: |
        dw run -i payload=input.json -f transformare.dwl
