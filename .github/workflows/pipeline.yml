name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone DataWeave CLI
        run: |
          git clone https://github.com/mulesoft/data-weave-cli.git "$HOME/dw-cli"

      - name: Build DataWeave CLI
        run: |
          cd "$HOME/dw-cli"
          chmod +x gradlew
          ./gradlew native-cli:installDist -x test

      - name: Add DataWeave CLI to PATH
        run: |
          echo "$HOME/dw-cli/native-cli/build/install/native-cli/bin" >> "$GITHUB_PATH"

      - name: Check DataWeave
        run: |
          which dw
          dw --version

      - name: Run DataWeave transformation
        run: |
          dw -i payload input.json -f transformare.dwl
