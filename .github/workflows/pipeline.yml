name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-dataweave:
    runs-on: windows-latest

    steps:
    - name: Checkout cod
      uses: actions/checkout@v4

    - name: Configurare Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalare si Configurare DataWeave CLI pe Windows
      shell: powershell
      run: |
        iwr -useb https://raw.githubusercontent.com/mulesoft-labs/data-weave-cli/main/scripts/install.ps1 | iex

    - name: Executare si Validare Transformare DataWeave
      shell: powershell
      run: |
        dw run -i payload=input.json -f transformare.dwl