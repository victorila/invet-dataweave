name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codul tau din Git
        uses: actions/checkout@v4

      - name: Configurare Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clonare DataWeave CLI din Git
        run: |
          git clone https://github.com/mulesoft/data-weave-cli.git $HOME/dw-cli

      - name: Compilare si Configurare Executabil
        run: |
          cd $HOME/dw-cli
          chmod +x gradlew
          ./gradlew installDist -x test
          
          # Cream folderul local pentru binare si identificam executabilul creat de Gradle
          mkdir -p $HOME/.local/bin
          
          # Cautam executabilul generat si facem un link simbolic catre comanda 'dw'
          BIN_FILE=$(find $HOME/dw-cli/build/install -type f \( -name "data-weave-cli" -o -name "dw" \) | head -n 1)
          ln -s "$BIN_FILE" $HOME/.local/bin/dw
          chmod +x $HOME/.local/bin/dw
          
          # Adaugam calea direct in PATH pentru toti pasii urmatori
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verificare instalare DataWeave
        run: dw --version

      - name: Executare si Validare Transformare DataWeave
        run: |
          dw -i payload input.json -f transformare.dwl