name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod din Git
        uses: actions/checkout@v4

      - name: Configurare Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clonare depozit DataWeave CLI
        run: |
          git clone https://github.com/mulesoft/data-weave-cli.git $HOME/dw-cli

      - name: Compilare si Instalare Globala
        run: |
          cd $HOME/dw-cli
          chmod +x gradlew
          ./gradlew native-cli:installDist -x test
          
          # Copiem distributia direct in /usr/local pentru acces sistemic
          INSTALL_DIR=$(find $HOME/dw-cli/native-cli/build/install -maxdepth 1 -mindepth 1 -type d | head -n 1)
          sudo cp -r $INSTALL_DIR/* /usr/local/
          
          # Identificam executabilul generat si cream comanda 'dw'
          EXEC_NAME=$(ls /usr/local/bin | head -n 1)
          sudo ln -s /usr/local/bin/$EXEC_NAME /usr/local/bin/dw
          sudo chmod +x /usr/local/bin/dw

      - name: Testare comanda dw
        run: dw --version

      - name: Executare si Validare Transformare DataWeave
        run: |
          dw -i payload input.json -f transformare.dwl