      - name: Install DataWeave CLI
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.dw"

          echo "Obtinem ultimul release DataWeave CLI..."

          API_URL="https://api.github.com/repos/mulesoft/data-weave-cli/releases/latest"

          ASSET_URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" \
            | jq -r '.assets[] | select(.name | test("linux"; "i")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: Nu am gasit asset-ul Linux."
            exit 1
          fi

          echo "Asset găsit:"
          echo "$ASSET_URL"

          curl -fL "$ASSET_URL" -o "$HOME/dw.zip"

          echo "Descarcare terminata:"
          ls -lh "$HOME/dw.zip"

          file "$HOME/dw.zip"

          unzip -q "$HOME/dw.zip" -d "$HOME/.dw"

          echo "$HOME/.dw/bin" >> "$GITHUB_PATH"
