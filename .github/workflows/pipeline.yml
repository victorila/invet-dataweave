name: Test DataWeave

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download DataWeave
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://github.com/mulesoft/data-weave-cli/releases/download/v1.0.36/dw-1.0.36-Linux" \
            -o "$HOME/dw"

          chmod +x "$HOME/dw"

          echo "=== FILE ==="
          file "$HOME/dw"

          echo "=== UNAME ==="
          uname -a

          echo "=== ARCH ==="
          uname -m

          echo "=== SIZE ==="
          ls -lh "$HOME/dw"

          echo "=== EXECUTE ==="
          "$HOME/dw" --version
