name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Install DataWeave CLI
        run: |
          VERSION="v1.0.36"

          mkdir -p "$HOME/.dw"

          curl -L \
            "https://github.com/mulesoft/data-weave-cli/releases/download/${VERSION}/dw-${VERSION}-linux-x64.zip" \
            -o "$HOME/dw.zip"

          unzip -q "$HOME/dw.zip" -d "$HOME/.dw"

          echo "$HOME/.dw/bin" >> "$GITHUB_PATH"

      - name: Verify DataWeave CLI
        run: |
          which dw
          dw --version

      - name: Run DataWeave transformation
        run: |
          dw run -i payload="$GITHUB_WORKSPACE/input.json" "$GITHUB_WORKSPACE/transformare.dwl"
