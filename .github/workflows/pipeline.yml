name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codul tau din Git
        uses: actions/checkout@v4

      - name: Configurare Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clonare DataWeave CLI din Git
        run: |
          git clone https://github.com/mulesoft/data-weave-cli.git $HOME/dw-cli

      - name: Compilare si adaugare in PATH
        run: |
          cd $HOME/dw-cli
          chmod +x gradlew
          ./gradlew installDist -x test
          
          # Cautam folderul bin creat de sub-modulul native-cli
          BIN_DIR=$(find $HOME/dw-cli -type d -path "*/build/install/*/bin" | head -n 1)
          
          # Facem legatura catre comanda dw daca executabilul se numeste diferit
          if [ -f "$BIN_DIR/data-weave-cli" ]; then
            ln -s "$BIN_DIR/data-weave-cli" "$BIN_DIR/dw"
          fi
          
          echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Verificare instalare DataWeave
        run: dw --version

      - name: Executare si Validare Transformare DataWeave
        run: |
          dw -i payload input.json -f transformare.dwl