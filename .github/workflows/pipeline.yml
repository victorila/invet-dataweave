name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout cod
      uses: actions/checkout@v4

    - name: Configurare Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Descarcare si Instalare DataWeave CLI Linux
      run: |
        curl -L https://github.com/mulesoft/data-weave-cli/releases/download/v1.0.36/dw-1.0.36-Linux.zip -o dw.zip
        unzip dw.zip -d dw_extracted
        chmod +x dw_extracted/dw-1.0.36-Linux/bin/dw || chmod +x dw_extracted/*/bin/dw || chmod +x dw_extracted/bin/dw
        sudo find dw_extracted -type f -name dw -exec mv {} /usr/local/bin/dw \;

    - name: Executare si Validare Transformare DataWeave
      run: |
        dw run -i payload=input.json -f transformare.dwl
