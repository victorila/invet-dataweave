name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone DataWeave CLI
        run: |
          git clone https://github.com/mulesoft/data-weave-cli.git "$HOME/dw-cli"

      - name: Build DataWeave CLI
        run: |
          cd "$HOME/dw-cli"
          chmod +x gradlew
          ./gradlew native-cli:installDist -x test

      - name: Locate DataWeave executable
        run: |
          echo "=== Caut executabilul dw ==="

          find "$HOME/dw-cli" -type f -name "dw" -o -type f -name "dw-cli" | head -20

          echo "=== Structura build/install ==="
          find "$HOME/dw-cli/native-cli/build/install" -maxdepth 5 -type f 2>/dev/null | head -50

      - name: Add DataWeave CLI to PATH
        run: |
          DW_BIN=$(find "$HOME/dw-cli/native-cli/build/install" -type f -name "dw" | head -n 1)

          if [ -z "$DW_BIN" ]; then
            echo "EROARE: Nu am găsit executabilul dw!"
            echo "Conținutul build/install:"
            find "$HOME/dw-cli/native-cli/build/install" -maxdepth 6 -print
            exit 1
          fi

          echo "dw găsit la: $DW_BIN"

          DW_DIR=$(dirname "$DW_BIN")
          echo "Adaug în PATH: $DW_DIR"

          echo "$DW_DIR" >> "$GITHUB_PATH"

      - name: Test DataWeave CLI
        run: |
          echo "PATH=$PATH"
          which dw
          dw --version

      - name: Run DataWeave transformation
        run: |
          dw -i payload input.json -f transformare.dwl
